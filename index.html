<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Deidre's PIE — Points Intelligence Engine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230B0F17' stroke='%23F2A93B' stroke-width='2'/><path d='M16 16 L16 2 A14 14 0 0 1 28.1 22.5 Z' fill='%23F2A93B'/><path d='M16 16 L28.1 22.5 A14 14 0 0 1 9.2 28.9 Z' fill='%2334C3B5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FAF5EA; --panel:#FFFFFF; --panel2:#F1E8D8; --line:#E4D9C2;
    --text:#3A2E22; --muted:#8A7A63; --amber:#BE7F3C; --amber-dim:#E4C99A;
    --teal:#6E8F6B; --danger:#C1543F;
    --c-amex:linear-gradient(135deg,#E8C4A0,#B76E5B);
    --c-citi:linear-gradient(135deg,#4C7FD6,#1F3E7A);
    --c-csr:linear-gradient(135deg,#5C6B85,#1C2334);
    --c-royal:linear-gradient(135deg,#1F7A8C,#0B3140);
    --c-united:linear-gradient(135deg,#3E6FA8,#0A2A54);
    --c-capone:linear-gradient(135deg,#C9CE8E,#7A8A3C);
    --c-td:linear-gradient(135deg,#3E7A4C,#0F2A18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{-webkit-appearance:none;appearance:none;background:none;border:none;font:inherit;color:inherit;padding:0;margin:0;}
  input{-webkit-appearance:none;appearance:none;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:88px;}
  ::-webkit-scrollbar{display:none;}
  .num{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}

  header{padding:22px 18px 16px; position:relative; overflow:hidden;}
  header::after{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
    background:conic-gradient(var(--amber) 0deg 130deg,var(--teal) 130deg 230deg,#B7A387 230deg 320deg,#C1694A 320deg 360deg);
    opacity:.18;filter:blur(2px);}
  .brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
  .brand-mark{width:34px;height:34px;border-radius:50%;flex:none;
    background:conic-gradient(var(--amber) 0deg 130deg,var(--teal) 130deg 230deg,#B7A387 230deg 320deg,#C1694A 320deg 360deg);
    border:2px solid var(--ink); box-shadow:0 0 0 1px var(--line);}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--text);}
  .brand-sub{color:var(--muted);font-size:12.5px;margin-top:2px;position:relative;z-index:1;}

  /* LOCK SCREEN */
  #lockScreen{position:fixed;inset:0;background:var(--ink);z-index:200;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;}
  #lockScreen .lock-mark{width:56px;height:56px;border-radius:50%;margin-bottom:18px;
    background:conic-gradient(var(--amber) 0deg 130deg,var(--teal) 130deg 230deg,#B7A387 230deg 320deg,#C1694A 320deg 360deg);
    box-shadow:0 0 0 1px var(--line);}
  #lockScreen .lock-title{font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-bottom:4px;color:var(--text);}
  #lockScreen .lock-sub{color:var(--muted);font-size:12.5px;margin-bottom:26px;}
  #lockScreen .pin-dots{display:flex;gap:14px;margin-bottom:26px;}
  #lockScreen .pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:transparent;transition:background .15s;}
  #lockScreen .pin-dot.filled{background:var(--amber);border-color:var(--amber);}
  #lockScreen .pin-dot.err{background:var(--danger);border-color:var(--danger);}
  #lockScreen .keypad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  #lockScreen .key{width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
    color:var(--text);font-family:'Space Grotesk';font-size:20px;font-weight:600;box-shadow:0 1px 3px rgba(90,70,40,.12);}
  #lockScreen .key:active{background:var(--panel2);}
  #lockScreen .key.ghost{background:none;border:none;box-shadow:none;}
  #lockScreen .lock-err{color:var(--danger);font-size:12px;margin-top:16px;height:14px;}
  #appRoot{display:none;}
  #appRoot.unlocked{display:block;}

  nav.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(250,245,234,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;}
  nav.tabs button.active{color:var(--amber);}
  nav.tabs .ic{font-size:18px;}

  .view{display:none;padding:4px 16px 20px;}
  .view.active{display:block;}

  .sec-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin:22px 0 10px;color:var(--text);
    display:flex;align-items:center;gap:8px;}
  .sec-title .tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);background:rgba(242,169,59,.1);
    border:1px solid var(--amber-dim);padding:2px 6px;border-radius:5px;}

  /* WALLET */
  .wallet-strip{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;}
  .wallet-item{scroll-snap-align:start;flex:none;width:220px;display:flex;flex-direction:column;gap:8px;}
  .wcard{width:220px;height:139px;border-radius:14px;background-size:cover;background-position:center;
    box-shadow:0 8px 20px -10px rgba(90,70,40,.35);border:1px solid var(--line);}
  .wallet-cap-name{font-family:'Space Grotesk';font-weight:600;font-size:13.5px;color:var(--text);}
  .wallet-cap-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

  .rate-table{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;background:var(--panel);}
  .rate-row{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);}
  .rate-row:last-child{border-bottom:none;}
  .rate-row .cat{color:var(--muted);}
  .rate-row .mult{font-family:'JetBrains Mono';font-weight:600;color:var(--amber);}

  /* RECOMMEND */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .cat-tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;color:var(--text);
    font-size:12.5px;font-weight:600;font-family:'Inter';box-shadow:0 1px 3px rgba(90,70,40,.06);}
  .cat-tile .ic{font-size:22px;display:block;margin-bottom:6px;}
  .cat-tile.sel{border-color:var(--amber);background:#F5E9D3;}

  .rec-list{margin-top:16px;}
  .rec-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;margin-bottom:8px;border:1px solid var(--line);background:var(--panel);}
  .rec-item.best{border-color:var(--amber);background:#FBF1DE;}
  .mini-card{width:46px;height:30px;border-radius:6px;flex:none;background-size:cover;background-position:center;
    box-shadow:0 2px 6px -2px rgba(90,70,40,.4);border:1px solid var(--line);}
  .mini-card.sm{width:26px;height:17px;border-radius:4px;}
  .rec-body{flex:1;min-width:0;}
  .rec-name{font-weight:600;font-size:13.5px;}
  .rec-why{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .rec-val{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--amber);text-align:right;}
  .rec-val .u{display:block;font-size:9px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
  .best-badge{font-size:9.5px;font-weight:700;color:#2A2013;background:var(--amber);padding:2px 7px;border-radius:20px;margin-left:8px;}

  .trip-note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#EDF1E9;border:1px solid #C7D6C1;
    font-size:12.5px;color:#3E4F3B;line-height:1.5;}

  /* BALANCES */
  .pie-wrap{display:flex;align-items:center;gap:18px;margin:8px 0 18px;}
  .pie{width:120px;height:120px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line);}
  .pie-legend{flex:1;display:flex;flex-direction:column;gap:6px;}
  .leg-row{display:flex;align-items:center;gap:8px;font-size:11.5px;}
  .leg-sw{width:9px;height:9px;border-radius:2px;flex:none;}
  .leg-name{color:var(--muted);flex:1;}
  .leg-val{font-family:'JetBrains Mono';font-weight:600;}
  .pie-total{font-family:'Space Grotesk';font-size:12px;color:var(--muted);margin-top:2px;}

  .bal-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(90,70,40,.06);}
  .bal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bal-name{font-weight:600;font-size:14px;flex:1;}
  .stale{font-size:9.5px;font-weight:700;color:var(--danger);background:#F7E3DE;border:1px solid #E5B6A9;
    padding:2px 6px;border-radius:20px;}
  .bal-row{display:flex;gap:8px;align-items:center;}
  .bal-input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;
    font-family:'JetBrains Mono';font-size:15px;}
  .bal-save{background:var(--amber);color:#FFF9EF;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;}
  .bal-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted);}
  .bal-meta a{color:var(--teal);text-decoration:none;}
  .bal-value{color:var(--amber);font-family:'JetBrains Mono';font-weight:600;}
  .flex-label{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:3px;}

  /* REDEEM */
  .redeem-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(90,70,40,.06);}
  .redeem-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
  .redeem-name-wrap{display:flex;align-items:center;gap:10px;}
  .redeem-name{font-weight:600;font-size:14px;}
  .redeem-cpp{font-family:'JetBrains Mono';color:var(--amber);font-size:12.5px;}
  .redeem-tips{color:var(--muted);font-size:12.5px;line-height:1.55;margin:0;padding-left:16px;}
  .redeem-tips li{margin-bottom:3px;}

  .trip-card{background:#F1EBDD;border:1px solid #DCCEA9;
    border-radius:14px;padding:14px 15px;margin-bottom:10px;}
  .trip-name{font-weight:700;font-family:'Space Grotesk';font-size:14px;color:#7A5A22;}
  .trip-date{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .trip-tip{font-size:12.5px;color:var(--text);margin-top:8px;line-height:1.5;}
  .trip-del{float:right;background:none;color:var(--muted);font-size:11px;}

  /* TRIP PLANNER */
  .plan-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0 22px;
    box-shadow:0 1px 3px rgba(90,70,40,.06);}
  .plan-title{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;color:var(--text);}
  .plan-sub{font-size:11.5px;color:var(--muted);margin:3px 0 12px;line-height:1.4;}
  .plan-input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 12px;font-family:'Inter';font-size:13.5px;margin-bottom:8px;}
  .plan-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .plan-row2 .plan-input{margin-bottom:8px;}
  select.plan-input{-webkit-appearance:none;appearance:none;}
  .plan-btn{width:100%;background:var(--amber);color:#FFF9EF;border:none;border-radius:10px;padding:11px;
    font-weight:700;font-size:13.5px;margin-top:4px;}
  .plan-result{margin-top:12px;padding:12px 14px;border-radius:12px;background:#F5E9D3;border:1px solid var(--amber-dim);
    font-size:12.5px;color:var(--text);line-height:1.5;}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-mark"></div>
  <div class="lock-title">Deidre's PIE</div>
  <div class="lock-sub">Enter PIN to continue</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <button class="key ghost"></button><button class="key" data-k="0">0</button><button class="key" id="pinDel">⌫</button>
  </div>
  <div class="lock-err" id="lockErr"></div>
</div>

<div id="appRoot"></div>

<script id="appTemplate" type="text/template">
<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <div class="brand-name">Deidre's PIE</div>
    </div>
  </div>
  <div class="brand-sub">Points Intelligence Engine — five cards, one best move</div>
</header>

<!-- CARDS -->
<div class="view active" id="v-cards">
  <div class="wallet-strip" id="wallet"></div>
  <div class="sec-title">Rate tables</div>
  <div id="rateTables"></div>
</div>

<!-- RECOMMEND -->
<div class="view" id="v-recommend">
  <div class="sec-title">Tap a category <span class="tag">best card</span></div>
  <div class="cat-grid" id="catGrid"></div>
  <div id="recOut"></div>
</div>

<!-- BALANCES -->
<div class="view" id="v-balances">
  <div class="sec-title">Your points pie</div>
  <div class="pie-wrap">
    <div class="pie" id="pieChart"></div>
    <div>
      <div class="pie-legend" id="pieLegend"></div>
      <div class="pie-total" id="pieTotal"></div>
    </div>
  </div>
  <div class="sec-title">Update balances</div>
  <div id="balCards"></div>
</div>

<!-- REDEEM -->
<div class="view" id="v-redeem">
  <div class="sec-title">Upcoming trips</div>
  <div id="tripCards"></div>

  <div class="plan-card">
    <div class="plan-title">🧭 Plan a trip</div>
    <div class="plan-sub">Tell it the trip, get an instant recommendation — no AI, just her real card rates.</div>
    <input class="plan-input" id="pt-name" placeholder="Trip name (e.g. Bahamas cruise)">
    <div class="plan-row2">
      <input class="plan-input" id="pt-line" placeholder="Cruise line / airline (optional)">
      <input class="plan-input" id="pt-ship" placeholder="Ship / flight # (optional)">
    </div>
    <div class="plan-row2">
      <input class="plan-input" type="date" id="pt-start">
      <input class="plan-input" type="date" id="pt-end">
    </div>
    <select class="plan-input" id="pt-cat"></select>
    <button class="plan-btn" id="pt-submit">Get recommendation</button>
  </div>

  <div class="sec-title">How to redeem, per card</div>
  <div id="redeemCards"></div>
</div>

<nav class="tabs">
  <button class="active" data-tab="cards"><span class="ic">💳</span>Cards</button>
  <button data-tab="recommend"><span class="ic">🥧</span>Recommend</button>
  <button data-tab="balances"><span class="ic">📊</span>Balances</button>
  <button data-tab="redeem"><span class="ic">🎯</span>Redeem</button>
</nav>
</script>

<script>
/* =========================================================================
   PIN LOCK — SHA-256 hashed, plaintext PIN never stored in this file.
   To change the PIN: compute a new SHA-256 hex hash of the digits and
   replace PIN_HASH below.
   ========================================================================= */
const PIN_HASH = "5b23e77bcbfd48044a8bd56f7689fc325f309690072fe25a5dfe11af0062a130";
let pinBuf = "";
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function renderDots(){
  const dots = [...document.querySelectorAll('#pinDots .pin-dot')];
  dots.forEach((d,i)=>{ d.classList.toggle('filled', i<pinBuf.length); d.classList.remove('err'); });
}
async function checkPin(){
  const hash = await sha256(pinBuf);
  if(hash===PIN_HASH){
    sessionStorage.setItem('pie_unlocked','1');
    unlockApp();
  } else {
    document.getElementById('lockErr').textContent = 'Incorrect PIN';
    document.querySelectorAll('#pinDots .pin-dot').forEach(d=>d.classList.add('err'));
    setTimeout(()=>{ pinBuf=''; renderDots(); document.getElementById('lockErr').textContent=''; }, 500);
  }
}
document.getElementById('keypad').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  if(btn.id==='pinDel'){ pinBuf = pinBuf.slice(0,-1); renderDots(); return; }
  if(btn.dataset.k===undefined) return;
  if(pinBuf.length>=4) return;
  pinBuf += btn.dataset.k;
  renderDots();
  if(pinBuf.length===4) checkPin();
});
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  const root = document.getElementById('appRoot');
  root.innerHTML = document.getElementById('appTemplate').innerHTML;
  root.classList.add('unlocked');
  initApp();
}
if(sessionStorage.getItem('pie_unlocked')==='1'){ unlockApp(); }
</script>


<script>
/* =========================================================================
   CONFIG — this is the entire "product" surface. To fork this engine for
   someone else, replace CARDS / TRIPS / PRODUCT below and nothing else

/* ========================= ENGINE — do not need to touch below ========================= */
function initApp(){
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const money = n => '$' + Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const miniCard = (c,size='') => `<div class="mini-card ${size}" style="background-image:url('${c.photo}')"></div>`;
const STORE_KEY = 'pie_balances_' + CONFIG.PRODUCT.owner.toLowerCase().replace(/[^a-z]/g,'');

function getBalances(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
    // Nothing saved yet on this device — seed once from CONFIG defaults,
    // then persist immediately so this branch never runs again here.
    const seeded = {};
    Object.entries(CONFIG.SEED_BALANCES||{}).forEach(([id,pts])=>{
      seeded[id] = { pts, updated: Date.now() };
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(seeded));
    return seeded;
  }catch(e){ return {}; }
}
function saveBalances(obj){ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }

// ---- TABS ----
$$('.tabs button').forEach(btn=>{
  btn.onclick=()=>{
    $$('.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    $$('.view').forEach(v=>v.classList.remove('active'));
    $('#v-'+btn.dataset.tab).classList.add('active');
  };
});

// ---- CARDS TAB ----
function renderWallet(){
  $('#wallet').innerHTML = CONFIG.CARDS.map(c=>`
    <div class="wallet-item">
      <div class="wcard" style="background-image:url('${c.photo}')"></div>
      <div>
        <div class="wallet-cap-name">${c.name}</div>
        <div class="wallet-cap-sub">${c.sub}</div>
      </div>
    </div>`).join('');
}
function renderRateTables(){
  $('#rateTables').innerHTML = CONFIG.CARDS.map(c=>`
    <div style="margin-bottom:16px;">
      <div style="font-weight:600;font-size:13px;margin-bottom:4px;">${c.name} <span style="color:var(--muted);font-weight:400;">— ${c.sub}</span></div>
      <div class="rate-table">
        ${CONFIG.CATEGORIES.filter(cat=>c.rates[cat.id]>1).map(cat=>`
          <div class="rate-row"><span class="cat">${cat.ic} ${cat.label}</span><span class="mult">${c.rates[cat.id]}x</span></div>
        `).join('') || '<div class="rate-row"><span class="cat">Flat rate</span><span class="mult">1x everywhere</span></div>'}
      </div>
    </div>`).join('');
}

// ---- RECOMMEND TAB ----
let selectedCat = null;
function renderCatGrid(){
  $('#catGrid').innerHTML = CONFIG.CATEGORIES.map(cat=>`
    <button class="cat-tile" data-cat="${cat.id}"><span class="ic">${cat.ic}</span>${cat.label}</button>
  `).join('');
  $$('.cat-tile').forEach(t=>t.onclick=()=>pickCategory(t.dataset.cat));
}
function pickCategory(catId){
  selectedCat = catId;
  $$('.cat-tile').forEach(t=>t.classList.toggle('sel', t.dataset.cat===catId));
  const cat = CONFIG.CATEGORIES.find(c=>c.id===catId);
  const ranked = [...CONFIG.CARDS].map(c=>({...c, mult:c.rates[catId]||1, eff:(c.rates[catId]||1)*c.cpp}))
    .sort((a,b)=>b.eff-a.eff);
  const relatedTrips = CONFIG.TRIPS.filter(t=>t.tag===catId);
  $('#recOut').innerHTML = `
    <div class="rec-list">
      ${ranked.map((c,i)=>`
        <div class="rec-item ${i===0?'best':''}">
          ${miniCard(c)}
          <div class="rec-body">
            <div class="rec-name">${c.name} ${i===0?'<span class="best-badge">BEST</span>':''}</div>
            <div class="rec-why">${c.mult}x on ${cat.label.toLowerCase()} · ~${c.cpp}¢/pt value</div>
          </div>
          <div class="rec-val">${c.eff.toFixed(1)}<span class="u">eff. ¢/$</span></div>
        </div>`).join('')}
    </div>
    ${relatedTrips.map(t=>`<div class="trip-note"><strong>${t.name}</strong> (${t.date}) — ${t.tip}</div>`).join('')}
  `;
}

// ---- BALANCES TAB ----
function renderPie(){
  const bal = getBalances();
  const vals = CONFIG.CARDS.map(c=>({...c, val:(bal[c.id]?.pts||0)*(c.cpp/100)}));
  const total = vals.reduce((s,c)=>s+c.val,0) || 1;
  let acc = 0;
  const segs = vals.map(c=>{
    const start = acc/total*360; acc += c.val; const end = acc/total*360;
    return `${c.dotColor} ${start}deg ${end}deg`;
  }).join(',');
  $('#pieChart').style.background = total<=1 ? 'conic-gradient(#232E44 0deg 360deg)' : `conic-gradient(${segs})`;
  $('#pieLegend').innerHTML = vals.map(c=>`
    <div class="leg-row"><span class="leg-sw" style="background:${c.dotColor}"></span>
    <span class="leg-name">${c.name}</span><span class="leg-val">${money(c.val)}</span></div>`).join('');
  $('#pieTotal').textContent = `Est. total value: ${money(vals.reduce((s,c)=>s+c.val,0))}`;
}
function renderBalCards(){
  const bal = getBalances();
  $('#balCards').innerHTML = CONFIG.CARDS.map(c=>{
    const rec = bal[c.id] || {};
    const pts = rec.pts || 0;
    const stale = rec.updated ? (Date.now()-rec.updated)/86400000 > 14 : true;
    const est = pts*(c.cpp/100);
    return `
    <div class="bal-card">
      <div class="bal-head">
        ${miniCard(c,'sm')}
        <span class="bal-name">${c.name} <span style="color:var(--muted);font-weight:400;font-size:12px;">${c.sub}</span></span>
        ${stale?'<span class="stale">Update</span>':''}
      </div>
      <div class="bal-row">
        <input class="bal-input" inputmode="numeric" pattern="[0-9,]*" placeholder="Points balance"
          value="${pts?pts.toLocaleString('en-US'):''}" id="in-${c.id}">
        <button class="bal-save" data-id="${c.id}">Save</button>
      </div>
      <div class="bal-meta">
        <span>${rec.updated? 'Updated '+new Date(rec.updated).toLocaleDateString():'Never updated'}</span>
        <a href="${c.loginUrl}" target="_blank">Check balance ↗</a>
      </div>
      <div class="bal-meta"><span class="bal-value">≈ ${money(est)}</span><span></span></div>
      <div class="flex-label">${c.flex}</div>
    </div>`;
  }).join('');
  $$('.bal-save').forEach(btn=>btn.onclick=()=>{
    const id = btn.dataset.id;
    const raw = $('#in-'+id).value.replace(/[^0-9]/g,'');
    const bal = getBalances();
    bal[id] = { pts: Number(raw)||0, updated: Date.now() };
    saveBalances(bal);
    renderBalCards(); renderPie();
  });
  $$('.bal-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const raw = inp.value.replace(/[^0-9]/g,'');
      inp.value = raw ? Number(raw).toLocaleString('en-US') : '';
    });
  });
}

// ---- REDEEM TAB / TRIP PLANNER ----
const TRIP_STORE_KEY = 'pie_trips_' + CONFIG.PRODUCT.owner.toLowerCase().replace(/[^a-z]/g,'');
function getCustomTrips(){ try{ return JSON.parse(localStorage.getItem(TRIP_STORE_KEY))||[]; }catch(e){ return []; } }
function saveCustomTrips(list){ localStorage.setItem(TRIP_STORE_KEY, JSON.stringify(list)); }

function fmtDateRange(start,end){
  if(!start) return '';
  const opts = {month:'short',day:'numeric'};
  const s = new Date(start+'T00:00:00');
  const sTxt = s.toLocaleDateString('en-US',opts);
  if(!end) return sTxt + ', ' + s.getFullYear();
  const e = new Date(end+'T00:00:00');
  const eTxt = e.toLocaleDateString('en-US', e.getFullYear()!==s.getFullYear()?{month:'short',day:'numeric',year:'numeric'}:opts);
  return sTxt + ' – ' + eTxt + (e.getFullYear()===s.getFullYear() ? ', '+e.getFullYear() : '');
}

function bestCardFor(catId){
  return [...CONFIG.CARDS].map(c=>({...c, mult:c.rates[catId]||1, eff:(c.rates[catId]||1)*c.cpp}))
    .sort((a,b)=>b.eff-a.eff)[0];
}

function renderTrips(){
  const custom = getCustomTrips();
  const staticHtml = CONFIG.TRIPS.map(t=>`
    <div class="trip-card">
      <div class="trip-name">${t.name}</div>
      <div class="trip-date">${t.date}</div>
      <div class="trip-tip">${t.tip}</div>
    </div>`).join('');
  const customHtml = custom.map(t=>`
    <div class="trip-card">
      <button class="trip-del" data-id="${t.id}">✕ remove</button>
      <div class="trip-name">${t.name}</div>
      <div class="trip-date">${t.date}${t.line?' · '+t.line:''}${t.ship?' · '+t.ship:''}</div>
      <div class="trip-tip">${t.tip}</div>
    </div>`).join('');
  $('#tripCards').innerHTML = (staticHtml + customHtml) || `<div class="trip-note">No trips yet — plan one below.</div>`;
  $$('.trip-del').forEach(btn=>btn.onclick=()=>{
    const list = getCustomTrips().filter(t=>t.id!==btn.dataset.id);
    saveCustomTrips(list);
    renderTrips();
  });
}

function initTripPlanner(){
  const sel = $('#pt-cat');
  sel.innerHTML = CONFIG.CATEGORIES.map(c=>`<option value="${c.id}">${c.ic} ${c.label}</option>`).join('');
  $('#pt-submit').onclick = ()=>{
    const name = $('#pt-name').value.trim();
    const line = $('#pt-line').value.trim();
    const ship = $('#pt-ship').value.trim();
    const start = $('#pt-start').value;
    const end = $('#pt-end').value;
    const catId = sel.value;
    if(!name){ $('#pt-name').focus(); return; }
    const cat = CONFIG.CATEGORIES.find(c=>c.id===catId);
    const best = bestCardFor(catId);
    let tip = `Use ${best.name} — ${best.mult}x on ${cat.label.toLowerCase()} (~${best.eff.toFixed(1)}¢/$ effective value).`;
    if(best.mult===1){
      tip += ` Neither card has a bonus here, so it's a flat 1x either way — pick whichever you'd rather redeem.`;
    }
    const trip = {
      id: 'ct'+Date.now(),
      name, line, ship,
      date: fmtDateRange(start,end),
      tag: catId,
      tip,
    };
    const list = getCustomTrips();
    list.push(trip);
    saveCustomTrips(list);
    renderTrips();
    ['pt-name','pt-line','pt-ship','pt-start','pt-end'].forEach(id=>$('#'+id).value='');
  };
}

function renderRedeemCards(){
  $('#redeemCards').innerHTML = CONFIG.CARDS.map(c=>`
    <div class="redeem-card">
      <div class="redeem-head">
        <div class="redeem-name-wrap">${miniCard(c,'sm')}<span class="redeem-name">${c.name}</span></div>
        <span class="redeem-cpp">~${c.cpp}¢/pt</span>
      </div>
      <ul class="redeem-tips">
        <li>${c.flex}</li>
        <li>Best used for: ${Object.entries(c.rates).filter(([k,v])=>v>1).map(([k])=>CONFIG.CATEGORIES.find(cc=>cc.id===k)?.label).join(', ') || 'general spend'}</li>
      </ul>
    </div>`).join('');
}

// ---- INIT ----
document.title = CONFIG.PRODUCT.name + ' — ' + CONFIG.PRODUCT.tagline;
$('.brand-name').textContent = CONFIG.PRODUCT.name;
renderWallet(); renderRateTables(); renderCatGrid(); renderPie(); renderBalCards(); renderTrips(); renderRedeemCards(); initTripPlanner();
} // end initApp
</script>
